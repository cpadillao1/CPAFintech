spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/fintech
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    # Configuración del Pool para manejar transacciones independientes
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

    # --- CONFIGURACIÓN DE SPRING BATCH ---
  batch:
    jdbc:
      initialize-schema: always # Crea las tablas BATCH_* automáticamente al iniciar
    job:
      enabled: false # Evita que todos los Jobs se ejecuten solos al arrancar la app

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true # Para que el SQL no sea una sola línea ilegible
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

# --- ESTO ES LO QUE NECESITAMOS PARA LAS PRUEBAS ---
logging:
  level:
    root: INFO
    com.fintech: DEBUG # Ver tus logs de AuditAspect y Services
    org.springframework.transaction: DEBUG # Ver cuándo se abren/cierran transacciones
    org.springframework.orm.jpa: DEBUG # Ver el flujo de Hibernate/JPA
    org.hibernate.orm.jdbc.bind: TRACE # Ver los valores reales que envías (ej: "SAV")

# Asegúrate de que no haya espacios antes de 'jwt'
jwt:
  secret: # 2 espacios de sangría
    key: "MiClaveSuperSecretaFintech2026!123456789" # 4 espacios de sangría
  expiration: # 2 espacios de sangría
    time: 7200000 # 4 espacios de sangría
